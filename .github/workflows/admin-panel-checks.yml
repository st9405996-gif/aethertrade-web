name: Admin Panel Checks

on:
  push:
    branches:
      - admin-panel-p0-p2-completion
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: "bun run lint -- --rule 'prettier/prettier: off'"
      - name: Unit tests
        run: bun run test
      - name: Generate SEO assets
        run: bun run seo
      - name: Verify SEO assets
        run: bun run seo:check
      - name: Production build
        run: bun run build
